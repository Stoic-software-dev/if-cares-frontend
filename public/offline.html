<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No connection · IF Cares</title>
<style>
  :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #475569; --card: #ffffff; --border: #e2e8f0; --primary: #0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --fg: #e2e8f0; --muted: #94a3b8; --card: #111a2c; --border: #1e293b; --primary: #2dd4bf; } }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 22rem; margin: 16px; padding: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0 0 16px; color: var(--muted); }
  a { display: inline-block; padding: 12px 16px; border-radius: 8px; background: var(--primary); color: #fff; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>This needs a connection</h1>
  <p>Without signal you can still open your dashboard, rosters, menus and take the meal count. Try this page again when you have signal.</p>
  <a href="/dashboard">Go to the dashboard</a>
</main>
</body>
</html>
